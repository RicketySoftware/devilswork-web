<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Devil's Work - Card Deck</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html">Home</a>
      <a href="deck.html" class="active">Card Deck</a>
    </nav>
  </header>

  <main class="container">
    <h1>Card Deck Generator</h1>
    <p class="subtitle">LOREM_IPSUM_DECK_SUBTITLE_TEXT</p>
    
    <div class="controls">
      <button id="btn-character" class="btn-primary">Create Character</button>
      <button id="btn-item" class="btn-secondary">Get Magic Item</button>
    </div>

    <h2>Character (Heart / Kin / Class)</h2>
    <div class="card-grid">
      <div id="slot-heart"><div class="card placeholder"><p>LOREM_HEART_SLOT</p></div></div>
      <div id="slot-kin"><div class="card placeholder"><p>LOREM_KIN_SLOT</p></div></div>
      <div id="slot-class"><div class="card placeholder"><p>LOREM_CLASS_SLOT</p></div></div>
    </div>

    <h2>Items</h2>
    <div class="card-grid" id="item-container">
      <!-- Item cards stack here -->
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
